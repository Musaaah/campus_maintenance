{% extends "tickets/base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-4">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-3">Log in</h1>
        {% if form.errors %}
        <div class="alert alert-danger">Incorrect username or password. Please try again.</div>
        {% endif %}
        <form method="post">
          {% csrf_token %}
          <input type="hidden" name="next" value="{{ next }}">
          <div class="mb-3">
            <label for="id_username" class="form-label fw-semibold">Username</label>
            <input type="text" name="username" id="id_username" class="form-control" autofocus autocomplete="username" required>
          </div>
          <div class="mb-3">
            <label for="id_password" class="form-label fw-semibold">Password</label>
            <input type="password" name="password" id="id_password" class="form-control" autocomplete="current-password" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Log in</button>
        </form>
        <p class="text-center small mt-3 mb-0">New here? <a href="{% url 'tickets:signup' %}">Create an account</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
